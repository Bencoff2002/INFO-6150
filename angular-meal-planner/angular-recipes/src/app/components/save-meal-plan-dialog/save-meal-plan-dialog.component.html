<div class="dialog-overlay" (click)="onCancel()">
    <div class="dialog" (click)="$event.stopPropagation()">
        <button class="close-btn" (click)="onCancel()" aria-label="Close">
            <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24">
                <path d="M0 0h24v24H0z" fill="none" />
                <path
                    d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
            </svg>
        </button>

        <h2 class="dialog-title">Save Meal Plan</h2>

        <div class="dialog-content">
            <div class="form-group">
                <label for="plan-name">Plan Name *</label>
                <input type="text" id="plan-name" [(ngModel)]="planName" placeholder="e.g., January Week 1, Keto Week"
                    class="form-control" (keypress)="onKeyPress($event)">
            </div>

            <div class="form-group">
                <label for="plan-description">Description (optional)</label>
                <textarea id="plan-description" [(ngModel)]="planDescription"
                    placeholder="Add notes about this meal plan..." class="form-control" rows="3"></textarea>
            </div>

            <p class="info-text">
                <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 0 24 24" width="18">
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" />
                </svg>
                This will save all meals from your current week.
            </p>
        </div>

        <div class="dialog-actions">
            <button class="btn btn-secondary" (click)="onCancel()">Cancel</button>
            <button class="btn btn-primary" (click)="onSave()" [disabled]="!isValid()">
                <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 0 24 24" width="18">
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path
                        d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z" />
                </svg>
                Save Plan
            </button>
        </div>
    </div>
</div>
