<div class="home-container">
    <app-navbar [(searchTerm)]="searchTerm" (search)="handleSearch($event)" [loading]="loading"></app-navbar>

    <!-- Admin Welcome Message -->
    <div *ngIf="isAdmin" class="admin-welcome">
        <div class="welcome-header">
            <svg xmlns="http://www.w3.org/2000/svg" height="80" viewBox="0 0 24 24" width="80" fill="currentColor">
                <path d="M0 0h24v24H0z" fill="none" />
                <path
                    d="M17 11c.34 0 .67.04 1 .09V6.27L10.5 3 3 6.27v4.91c0 4.54 3.2 8.79 7.5 9.82.55-.13 1.08-.32 1.6-.55-.69-.98-1.1-2.17-1.1-3.45 0-3.31 2.69-6 6-6z" />
                <path
                    d="M17 13c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 1.38c.62 0 1.12.51 1.12 1.12s-.51 1.12-1.12 1.12-1.12-.51-1.12-1.12.5-1.12 1.12-1.12zm0 5.37c-.93 0-1.74-.46-2.24-1.17.05-.72 1.51-1.08 2.24-1.08s2.19.36 2.24 1.08c-.5.71-1.31 1.17-2.24 1.17z" />
            </svg>
            <h1>Welcome, {{ user?.name || 'Admin' }}!</h1>
        </div>
    </div>

    <!-- Regular User Content -->
    <div *ngIf="!isAdmin">
        <div class="hero">
            <h2>Explore <span class="highlight">Culinary</span> Insights</h2>
            <h6>Discover amazing recipes for every taste</h6>
            <div class="categories">
                <button *ngFor="let category of categories" [class.active]="activeCategory.label === category.label"
                    (click)="handleCategorySelect(category)">
                    {{ category.icon }} {{ category.label }}
                </button>
            </div>
        </div>

        <div *ngIf="error" class="alert alert-error">{{ error }}</div>

        <div *ngIf="loading" class="loading-container">
            <div class="spinner"></div>
            <p>Loading recipes...</p>
        </div>

        <div *ngIf="!loading && recipes.length > 0">
            <div class="recipe-grid">
                <div *ngFor="let recipe of recipes">
                    <app-recipe-card [recipe]="recipe" [user]="user" [favorites]="favorites"></app-recipe-card>
                </div>
            </div>
            <div class="pagination" *ngIf="totalResults > recipesPerPage">
                <button (click)="fetchPage(currentPage - 1)" [disabled]="currentPage === 1">Previous</button>
                <span>Page {{ currentPage }} of {{ totalResults / recipesPerPage | number:'1.0-0' }}</span>
                <button (click)="fetchPage(currentPage + 1)"
                    [disabled]="currentPage >= (totalResults / recipesPerPage)">Next</button>
            </div>
        </div>

        <div *ngIf="!loading && searchTerm && recipes.length === 0" class="alert alert-info">
            No recipes found for "{{ searchTerm }}". Try different keywords!
        </div>
    </div>
</div>
