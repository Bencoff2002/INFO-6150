<div class="edit-profile-container">
    <app-navbar></app-navbar>

    <div class="content-wrapper">
        <div class="form-container">
            <button class="back-button" (click)="goBack()" aria-label="Go back">
                <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24">
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                </svg>
            </button>

            <h1 class="page-title">Edit Profile</h1>
            <p class="page-subtitle">Update your personal information</p>

            <form (ngSubmit)="handleSubmit()" class="profile-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" [(ngModel)]="name" name="name" placeholder="Enter your full name"
                        required />
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="Enter your email"
                        required />
                </div>

                <div class="alert alert-error" *ngIf="error">
                    {{ error }}
                </div>

                <div class="alert alert-success" *ngIf="success">
                    {{ success }}
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" (click)="goBack()">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary" [disabled]="loading">
                        {{ loading ? 'Saving...' : 'Save Changes' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
