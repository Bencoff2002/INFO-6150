<div class="top-rated-container">
    <div class="page-header">
        <button class="back-btn" (click)="goBack()">
            <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24">
                <path d="M0 0h24v24H0z" fill="none" />
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
            </svg>
            Back
        </button>
        <h1 class="page-title">Top Rated Recipes</h1>
        <p class="page-subtitle">Discover the most loved recipes by our community</p>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="loading-container">
        <div class="spinner"></div>
    </div>

    <!-- Error State -->
    <div *ngIf="error && !loading" class="error-container">
        <div class="alert alert-error">{{ error }}</div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && !error && recipes.length === 0" class="empty-container">
        <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" height="64" viewBox="0 0 24 24" width="64">
            <path d="M0 0h24v24H0z" fill="none" />
            <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
        </svg>
        <h3 class="empty-title">No Rated Recipes Yet</h3>
        <p class="empty-text">Be the first to rate some recipes and they'll appear here!</p>
    </div>

    <!-- Recipes Grid -->
    <div *ngIf="!loading && !error && recipes.length > 0" class="recipes-grid">
        <app-recipe-card *ngFor="let recipe of recipes" [recipe]="recipe" [rating]="recipe.averageRating">
        </app-recipe-card>
    </div>
</div>
