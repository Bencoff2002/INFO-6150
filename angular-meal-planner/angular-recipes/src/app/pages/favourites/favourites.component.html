<div class="favourites-container">
    <div class="page-header">
        <button class="back-btn" (click)="goBack()">
            <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24">
                <path d="M0 0h24v24H0z" fill="none" />
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
            </svg>
            Back
        </button>
        <h1 class="page-title">My Favourite Recipes</h1>
        <p class="page-subtitle">Your collection of saved recipes</p>
    </div>

    <!-- Not Logged In -->
    <div *ngIf="!user && !loading" class="login-prompt">
        <svg class="prompt-icon" xmlns="http://www.w3.org/2000/svg" height="64" viewBox="0 0 24 24" width="64">
            <path d="M0 0h24v24H0z" fill="none" />
            <path
                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
        </svg>
        <h3 class="prompt-title">Sign In Required</h3>
        <p class="prompt-text">Please log in to view your favourite recipes</p>
        <button class="login-button" (click)="navigateToLogin()">Log In</button>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="loading-container">
        <div class="spinner"></div>
    </div>

    <!-- Error State -->
    <div *ngIf="error && !loading" class="error-container">
        <div class="alert alert-error">{{ error }}</div>
    </div>

    <!-- Empty State -->
    <div *ngIf="user && !loading && !error && recipes.length === 0" class="empty-container">
        <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" height="64" viewBox="0 0 24 24" width="64">
            <path d="M0 0h24v24H0z" fill="none" />
            <path
                d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z" />
        </svg>
        <h3 class="empty-title">No Favourite Recipes Yet</h3>
        <p class="empty-text">Start exploring and save your favorite recipes here!</p>
        <button class="browse-button" (click)="router.navigate(['/'])">Browse Recipes</button>
    </div>

    <!-- Recipes Grid -->
    <div *ngIf="user && !loading && !error && recipes.length > 0" class="recipes-grid">
        <app-recipe-card *ngFor="let recipe of recipes" [recipe]="recipe">
        </app-recipe-card>
    </div>
</div>
