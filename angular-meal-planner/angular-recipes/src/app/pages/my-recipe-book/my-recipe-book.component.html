<div class="my-recipe-book-container">
    <div class="page-header">
        <div class="header-content">
            <div>
                <button class="back-btn" (click)="goBack()">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24">
                        <path d="M0 0h24v24H0z" fill="none" />
                        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                    </svg>
                    Back
                </button>
                <h1 class="page-title">My Recipe Book</h1>
                <p class="page-subtitle">Create and manage your personal recipes</p>
            </div>
            <button *ngIf="user" class="create-button" (click)="createNewRecipe()" aria-label="Create new recipe">
                <svg xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 0 24 24" width="20" fill="currentColor">
                    <path d="M0 0h24v24H0z" fill="none" />
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                </svg>
                Create Recipe
            </button>
        </div>
    </div>

    <!-- Not Logged In -->
    <div *ngIf="!user && !loading" class="login-prompt">
        <svg class="prompt-icon" xmlns="http://www.w3.org/2000/svg" height="64" viewBox="0 0 24 24" width="64">
            <path d="M0 0h24v24H0z" fill="none" />
            <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
        </svg>
        <h3 class="prompt-title">Sign In Required</h3>
        <p class="prompt-text">Please log in to view and manage your recipe book</p>
        <button class="login-button" (click)="navigateToLogin()">Log In</button>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="loading-container">
        <div class="spinner"></div>
        <p>Loading your recipes...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="error && !loading" class="error-container">
        <div class="alert alert-error">{{ error }}</div>
    </div>

    <!-- Empty State -->
    <div *ngIf="user && !loading && !error && recipes.length === 0" class="empty-container">
        <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" height="64" viewBox="0 0 24 24" width="64">
            <path d="M0 0h24v24H0z" fill="none" />
            <path
                d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z" />
        </svg>
        <h3 class="empty-title">No Recipes Yet</h3>
        <p class="empty-text">Start building your personal recipe collection!</p>
        <button class="create-button-large" (click)="createNewRecipe()">
            <svg xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 0 24 24" width="20" fill="currentColor">
                <path d="M0 0h24v24H0z" fill="none" />
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
            </svg>
            Create Your First Recipe
        </button>
    </div>

    <!-- Recipes Grid -->
    <div *ngIf="user && !loading && !error && recipes.length > 0" class="recipes-grid">
        <app-recipe-card *ngFor="let recipe of recipes" [recipe]="recipe">
        </app-recipe-card>
    </div>
</div>
